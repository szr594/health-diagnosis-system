# =============================================================================
# 大健康行业智能问诊系统 - Docker Compose 一键部署
# 使用方式：
#   1. cp ai-service/.env.example ai-service/.env  并填入 DEEPSEEK_API_KEY
#   2. docker-compose up -d --build
#   3. 访问 http://localhost:8080  (后端 API)
# =============================================================================
name: health-diagnosis

services:
  mysql:
    image: mysql:8.0
    container_name: health-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: health_diagnosis_db
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动执行建库脚本
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: health-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build: ./ai-service
    container_name: health-ai
    # 从 .env 读取 DEEPSEEK_API_KEY 等配置（不存在则使用容器默认值）
    env_file:
      - path: ./ai-service/.env
        required: false
    environment:
      CHROMA_PERSIST_DIR: /app/data/chroma
    ports:
      - "8001:8001"
    volumes:
      - chroma-data:/app/data

  backend:
    build: ./backend
    container_name: health-backend
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # 容器内通过服务名访问 AI 服务
      AI_BASE_URL: http://ai-service:8001
      JWT_SECRET: ${JWT_SECRET:-health-diagnosis-jwt-secret-key-please-change-in-prod}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started

volumes:
  mysql-data:
  redis-data:
  chroma-data:
