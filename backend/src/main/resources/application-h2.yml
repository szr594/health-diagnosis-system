# H2 开发环境配置
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/health-diagnosis;MODE=MySQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    username: sa
    password:
    hikari:
      data-source-properties:
        characterEncoding: UTF-8
        useUnicode: true
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
      encoding: UTF-8
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
  jackson:
    default-property-inclusion: non_null

server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

health:
  ai:
    base-url: ${AI_BASE_URL:http://localhost:8001}
    timeout-ms: 60000
    fallback-enabled: true
  redis:
    cache-ttl: 600
